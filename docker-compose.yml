services:
  db:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    # DB_PASSWORD и прочие DB_* берутся из env-файла бэкенда
    env_file: ./backend/.env

    environment:
      POSTGRES_DB: studportrait
      POSTGRES_USER: postgres
      # Нужен только при первичной инициализации
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studportrait"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    # DB_NAME/DB_USER/DB_PASSWORD берутся из env-файла бэкенда,
    # ниже переопределяются только переменные, специфичные для контейнера.
    env_file: ./backend/.env

    environment:
      DJANGO_SETTINGS_MODULE: studportrait.settings
      PYTHONUNBUFFERED: "1"

      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "60"
      DB_DISABLE_SERVER_SIDE_CURSORS: "1"
      REDIS_URL: redis://redis:6379/1
      USE_REDIS_CACHE: "1"

    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8000/portrait/health/'', timeout=5)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped

    # Свой entrypoint: образ пишет пароль в userlist как md5-хэш, а Postgres 18
    # принимает только SCRAM. Здесь userlist с plaintext — pgbouncer сам делает SCRAM.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./backend/pgbouncer/entrypoint.sh:/entrypoint.sh:ro

    # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD берутся из env-файла бэкенда.
    env_file: ./backend/.env

    environment:
      DB_HOST: db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "3000"
      DEFAULT_POOL_SIZE: "25"

    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    external: true

  redis_data:
