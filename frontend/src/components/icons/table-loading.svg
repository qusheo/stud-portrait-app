  </g>
  <g fill="#E5EAF0" class="shimmer d3">
    <rect x="57" y="280" width="103" height="12" rx="6"/><rect x="248" y="280" width="86" height="12" rx="6"/><rect x="387" y="280" width="56" height="12" rx="6"/><rect x="478" y="280" width="52" height="12" rx="6"/>
