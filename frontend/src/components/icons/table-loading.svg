  <rect x="478" y="64" width="56" height="14" rx="7" fill="#CBD5E1"/>
  <g fill="#E5EAF0" class="shimmer">
    <rect x="57" y="121" width="137" height="12" rx="6"/><rect x="248" y="121" width="94" height="12" rx="6"/><rect x="387" y="121" width="45" height="12" rx="6"/><rect x="478" y="121" width="54" height="12" rx="6"/>
  </g>
  <g fill="#E5EAF0" class="shimmer d1">
