<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Страница недоступна</title>

        <script>
            setInterval(() => {
                fetch(window.location.href)
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        }
                    })
                    .catch(() => {});
            }, 5000);
        </script>

        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 100px;
            }
        </style>
    </head>

    <body>
        <h1>Сервис временно недоступен</h1>
        <p>Ожидание восстановления...</p>
    </body>
</html>
