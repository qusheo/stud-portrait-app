services:
  backend-profile:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "pip install --no-cache-dir pyroscope-io &&
         python -m uvicorn studportrait.asgi:application --app-dir /app/src --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "127.0.0.1:8000:8000"
    environment:      
      DJANGO_SETTINGS_MODULE: studportrait.settings
      PYTHONUNBUFFERED: "1"

      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: studportrait
      DB_USER: postgres
      #REDIS_URL: redis://redis:6379/1
      PYROSCOPE_ENABLED: "1"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope:4040"
    networks:
      - profiling-net

networks:
  profiling-net:
    external: true