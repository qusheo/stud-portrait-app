services:
  backend-profile:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "pip install --no-cache-dir pyroscope-io &&
             python -m uvicorn studportrait.asgi:application --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      PYROSCOPE_ENABLED: "1"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope:4040"
    networks:
      - profiling-net

networks:
  profiling-net:
    external: true