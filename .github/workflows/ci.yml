name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  DB_PASSWORD: ci_db_password
  VITE_API_URL: ""

jobs:
  frontend-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend-tests:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studportrait
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studportrait"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: studportrait
      DB_USER: postgres
      DB_PASSWORD: postgres
      USE_REDIS_CACHE: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend/src
        run: pytest portrait/test -v

  api-tests:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create shared postgres volume
        run: docker volume create postgres_data

      - name: Build and start application
        run: docker compose up -d --build --wait

      - name: Backend health check
        run: >
          curl --fail --silent --show-error
          --retry 30 --retry-delay 5 --retry-all-errors
          http://localhost/portrait/health/

      - name: Auth endpoints respond
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/portrait/auth/csrf/)" = "200"

      - name: Frontend serves app
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login)" = "200"

      - name: Stop application
        if: always()
        run: docker compose down

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create shared postgres volume
        run: docker volume create postgres_data

      - name: Build and start application
        run: docker compose up -d --build --wait

      - name: Backend health check
        run: >
          curl --fail --silent --show-error
          --retry 30 --retry-delay 5 --retry-all-errors
          http://localhost/portrait/health/

      - name: Django system checks
        run: docker compose exec -T backend python src/manage.py check

      - name: Run backend test suite against running stack
        run: docker compose exec -T backend sh -c "cd src && pytest portrait/test -v"

      - name: Stop application
        if: always()
        run: docker compose down

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create shared postgres volume
        run: docker volume create postgres_data

      - name: Build and start application
        run: docker compose up -d --build --wait

      - name: Backend health check
        run: >
          curl --fail --silent --show-error
          --retry 30 --retry-delay 5 --retry-all-errors
          http://localhost/portrait/health/

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down
